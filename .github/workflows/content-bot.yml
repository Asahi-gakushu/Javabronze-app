name: 週次コンテンツボット

# 毎週月曜 6:07（日本時間）: Claude が新しい問題を作り、別の Claude が答えを見ずに解き直す。
# 答えが一致した問題だけを残し、チェック・ビルド・コミットして再デプロイする。
on:
  schedule:
    - cron: "7 21 * * 0"
  workflow_dispatch:
    inputs:
      questions_per_topic:
        description: "1トピックあたりの新規問題数"
        default: "3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 問題を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUESTIONS_PER_TOPIC: ${{ inputs.questions_per_topic || '3' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Secret の ANTHROPIC_API_KEY が未設定のため、問題生成をスキップしました。"
            exit 0
          fi
          npm run generate
      - run: npm run validate
      - run: npm run build
      - id: commit
        name: 新しい問題をコミット
        run: |
          if git diff --quiet -- src/data/topics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "javabronze-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/topics
          git commit -m "コンテンツ: 今週の Java Bronze 問題を追加"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN による push では他のワークフローが起動しないため、明示的に再デプロイする。
  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
