<title>推しと晩酌 開業ロードマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F1EA; --surface:#FFFDF8; --sunk:#EDE7DC; --ink:#1F2A44; --muted:#5D6478; --faint:#8A8F9E;
  --line:#E2DACB; --accent:#E0A33A; --accent-ink:#8A5A08; --accent-soft:#F7E6C4;
  --pA:#2F4A7A; --pB:#B4553A; --pC:#9A6A0E; --pAI:#5D6478;
  --pA-soft:#E3E9F4; --pB-soft:#F6E2DA; --pC-soft:#F4EAD2; --pAI-soft:#E8E8EC;
  --done:#357A52; --late:#B83A2E; --late-soft:#F7DEDA; --focus:#2F6FDB;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#131826; --surface:#1B2233; --sunk:#232C40; --ink:#ECE6DA; --muted:#A6ACBB; --faint:#7E8496;
  --line:#2E3850; --accent:#E8B04E; --accent-ink:#F2C774; --accent-soft:#3A3120;
  --pA:#9DB4E4; --pB:#E9927A; --pC:#E6BD5E; --pAI:#A6ACBB;
  --pA-soft:#243252; --pB-soft:#3D2721; --pC-soft:#3A3120; --pAI-soft:#2A3142;
  --done:#6CC08E; --late:#F08A7E; --late-soft:#3E2220; --focus:#7FA8F5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131826; --surface:#1B2233; --sunk:#232C40; --ink:#ECE6DA; --muted:#A6ACBB; --faint:#7E8496;
  --line:#2E3850; --accent:#E8B04E; --accent-ink:#F2C774; --accent-soft:#3A3120;
  --pA:#9DB4E4; --pB:#E9927A; --pC:#E6BD5E; --pAI:#A6ACBB;
  --pA-soft:#243252; --pB-soft:#3D2721; --pC-soft:#3A3120; --pAI-soft:#2A3142;
  --done:#6CC08E; --late:#F08A7E; --late-soft:#3E2220; --focus:#7FA8F5;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px;display:grid;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,5vw,36px)}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
.head{display:grid;gap:10px}
.countdown{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;color:var(--muted)}
.countdown strong{font-family:var(--display);font-size:22px;color:var(--ink)}
.dday{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font-weight:700}
.sync{font-size:12px;color:var(--faint)}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;border-top:4px solid var(--c)}
.member .top{display:flex;align-items:center;gap:10px}
.badge{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface);font-family:var(--display);font-weight:700}
.member .nm{font-weight:700}
.member input{border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;font-weight:700;width:100%;min-width:0}
.member input:hover{border-color:var(--line)}
.member input:focus{border-color:var(--c);background:var(--bg);outline:none}
.role{font-size:13px;color:var(--muted);margin:0}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.meter-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.next{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:2px}
.next b{font-size:11px;letter-spacing:.1em;color:var(--c)}
.next .due{color:var(--muted);font-size:12px}
.next.done-all{color:var(--done)}

/* phase strip */
.strip-wrap{overflow-x:auto}
.strip{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:4px;min-width:780px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;display:grid;gap:4px}
.ph .t{font-weight:700;font-size:13px}
.ph .d{color:var(--muted)}
.ph .bar{height:4px;background:var(--sunk);border-radius:9px;overflow:hidden}
.ph .bar span{display:block;height:100%;background:var(--accent)}
.ph.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ph.now .t::before{content:"いまここ";display:block;color:var(--accent-ink);font-size:11px;letter-spacing:.08em}

/* controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}

/* sections */
section{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.sec-head .meta{font-size:13px;color:var(--muted)}
.side{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:1px 8px;margin-left:6px;font-family:var(--body);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.empty{padding:16px;color:var(--muted);font-size:14px}

.task{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--done);cursor:pointer}
.task label{cursor:pointer;display:block}
.task .tid{font-size:11.5px;color:var(--faint);margin-right:6px}
.task .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.task.is-done label{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.task.is-done .meta{opacity:.7}
.who{border-radius:4px;padding:0 7px;font-weight:700;font-size:12px}
.who.me{background:var(--pA-soft);color:var(--pA)}
.who.B{background:var(--pB-soft);color:var(--pB)}
.who.C{background:var(--pC-soft);color:var(--pC)}
.who.ai{background:var(--pAI-soft);color:var(--pAI)}
.kind{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px}
.late{color:var(--late);font-weight:700}
.late-tag{background:var(--late-soft);color:var(--late);border-radius:4px;padding:0 6px;font-weight:700;font-size:11.5px}
.donemark{color:var(--done);font-weight:500}
.owner-note{color:var(--faint)}

/* weeks */
details.weeks{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.weeks summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:16px}
.table-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;min-width:760px;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0}
td.wk{white-space:nowrap;font-weight:700}
tr.this-week td{background:var(--accent-soft)}
td.ms{color:var(--accent-ink);font-weight:500}
.foot{font-size:12.5px;color:var(--faint);display:grid;gap:4px}
@media (max-width:520px){.wrap{gap:22px}.task{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">

  </footer>
</div>

, "start": "2027-02-08", "me": "火災保険(1h)、**消防・保健所の事前相談 2/12(半休〜1日)**、DIY・搬入の手段を決めて予約(1h)", "ai": "ai-admin 便利屋・配送の見積比較", "milestone": "★F2 完了 2/12"}, {"week": "W21", "period": "2/15〜2/21", "start": "2027-02-15", "me": "内装材の発注(1h)、搬入ルールの確認(15m)、カメラマンの発注(1h)、電気の申込(30m)(計3h)", "ai": "ai-designer ブランド制作", "milestone": ""}, {"week": "W22", "period": "2/22〜2/28", "start": "2027-02-22", "me": "中古家具・家電の購入(土、4h。配送は 3/14 指定)、工事計画届(要る場合)(1h)(計5h)", "ai": "ai-admin 中古品の確認リスト", "milestone": "購入完了 2/28"}, {"week": "W23", "period": "3/1〜3/7", "start": "2027-03-01", "me": "**鍵渡し 3/1(半休)**・全面写真(1.5h)、**壁紙DIY 3/6〜7**(友人と8h/1人なら12h)(計10〜14h)※", "ai": "ai-designer 施工中の相談", "milestone": "★入居 3/1"}, {"week": "W24", "period": "3/8〜3/14", "start": "2027-03-08", "me": "床・照明(4h、3/13)、SNS 開設(1h)、**搬入 3/14(便利屋・店配送)**(4h)、新品の受け取り(2h)(計11h)※", "ai": "ai-writer 告知文", "milestone": "★SNS開設 3/13(D−35)"}, {"week": "W25", "period": "3/15〜3/21", "start": "2027-03-15", "me": "防犯機器の設置(3h)、音量の試聴(1.5h)、支出の記録(15m)、F3 完了判定(30m)、告知開始(30m)(計6h)", "ai": "ai-designer 配置の確認", "milestone": "★告知開始 3/20(D−28)"}, {"week": "W26", "period": "3/22〜3/28", "start": "2027-03-22", "me": "撮影の準備(2h)、**プロ撮影 3/27**(4h)、スマホ撮影 3/28(2h)、SNS(30m)(計8.5h)", "ai": "ai-writer モデルの同意書", "milestone": "★撮影 3/27"}, {"week": "W27", "period": "3/29〜4/4", "start": "2027-03-29", "me": "掲載文・規約の確定(2h)、ポータル2社の申請(4h)、施設賠償保険(1h)、清掃委託の契約(2h)(計9h)", "ai": "ai-writer・ai-admin 最終確認", "milestone": "★ポータル申請 4/3(D−14)"}, {"week": "W28", "period": "4/5〜4/11", "start": "2027-04-05", "me": "**使用開始届 4/9(半休)**、掲示・備品(2h)、予約の自動化テスト(2h)、緊急時の連絡順(1h)、通し運用テスト 4/11(2h)(計7h+半休)※", "ai": "ai-programmer・ai-analyst 集計と KPI シート", "milestone": "★使用開始届 4/9"}, {"week": "W29", "period": "4/12〜4/18", "start": "2027-04-12", "me": "Go 判定(30m)、公開・価格設定(1h)、**開業 4/17**、初回の清掃・様子見(2h)(計3.5h)", "ai": "ai-analyst 週次 KPI 開始", "milestone": "★**開業 D = 4/17**"}, {"week": "W30〜W33", "period": "4/19〜5/16", "start": "2027-04-19", "me": "GW の予約対応、レビュー返信(週1h)、土日の清掃、SNS(週1h)、申告 4/30", "ai": "ai-writer 返信の定型文、ai-analyst 週次 KPI", "milestone": "★申告 4/30【未確認】、月次レビュー 5/15"}, {"week": "W34〜W38", "period": "5/17〜6/20", "start": "2027-05-17", "me": "開業届と青色申告 5/17、定価に戻す、KPI の引き直し、清掃委託の範囲見直し", "ai": "ai-marketer・ai-analyst KPI の引き直し", "milestone": "★開業届 5/17、月次レビュー 6/12"}, {"week": "W39〜W43", "period": "6/21〜7/18", "start": "2027-06-21", "me": "3ヶ月判定の準備、会議系ポータルの判断、作業時間の振り返り", "ai": "ai-analyst 3ヶ月判定の資料", "milestone": "★3ヶ月判定 7/17"}]};
const D_DAY = DATA.dday;
const KINDS = {home:"家でできる", out:"出かける", contact:"相手とやりとり", ai:"AIに任せる"};
const FILTERS = [["all","すべて"],["me","自分"],["home","家でできる"],["out","出かける"],["contact","相手とやりとり"],["ai","AI社員"]];

const state = {checks:{}, filter:"all", hideDone:false, db:null};
try{ const f = localStorage.getItem("rs-filter"); if(f && FILTERS.some(x=>x[0]===f)) state.filter = f; state.hideDone = localStorage.getItem("rs-hide")==="1"; }catch(e){}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function toDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function days(a,b){ return Math.round((b-a)/86400000); }
const isDone = t => !!(state.checks[t.id] && state.checks[t.id].done);
const isLate = t => t.due && !isDone(t) && toDate(t.due) < today();

function matches(t){
  const f = state.filter;
  if(f==="all") return true;
  if(f==="me" || f==="ai") return t.who===f;
  return t.kinds.includes(f);
}
const byDue = (a,b) => (a.due||"9999").localeCompare(b.due||"9999") || a.id.localeCompare(b.id);

function taskRow(t, where){
  const done = isDone(t), c = state.checks[t.id];
  const who = `<span class="who ${t.who}">${t.who==="ai"?"AI社員":"自分"}</span>`;
  const kinds = t.kinds.map(k=>`<span class="kind">${KINDS[k]}</span>`).join("");
  const due = t.dueText ? `<span class="num ${isLate(t)?"late":""}">期限 ${esc(t.dueText)}</span>` : "";
  const late = isLate(t) ? `<span class="late-tag">期限切れ</span>` : "";
  const deps = t.deps ? `<span>前提 ${esc(t.deps)}</span>` : "";
  const time = t.time ? `<span>目安 ${esc(t.time)}</span>` : "";
  const doneAt = done && c.at ? `<span class="donemark num">✓ ${new Date(c.at).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"})} 完了</span>` : "";
  const note = t.owner && t.owner!=="自分" ? `<span class="owner-note">担当:${esc(t.owner)}</span>` : "";
  return `<div class="task ${done?"is-done":""}">
    <input type="checkbox" id="cb-${where}-${t.id}" data-id="${t.id}" ${done?"checked":""}>
    <label for="cb-${where}-${t.id}"><span class="tid num">${t.id}</span>${esc(t.text)}</label>
    <div class="meta">${who}${kinds}${due}${late}${time}${deps}${note}${doneAt}</div>
  </div>`;
}
function listHTML(tasks, where){
  const shown = tasks.filter(t => matches(t) && !(state.hideDone && isDone(t)));
  if(!shown.length) return `<div class="empty">この条件で表示するタスクはありません。</div>`;
  return shown.map(t=>taskRow(t, where)).join("");
}
function card(title, cls, color, tasks, emptyMsg){
  const d = tasks.filter(isDone).length, pct = tasks.length ? Math.round(d/tasks.length*100) : 0;
  const nxt = tasks.filter(t=>!isDone(t)).sort(byDue)[0];
  return `<div class="member" style="--c:${color}">
    <div class="top"><span class="badge">${cls}</span><span class="nm">${title}</span></div>
    <div class="meter" role="img" aria-label="${d}/${tasks.length} 完了"><span style="width:${pct}%"></span></div>
    <div class="meter-row num"><span>${d}/${tasks.length} 完了</span><span>${pct}%</span></div>
    ${nxt ? `<div class="next"><b>次にやる1つ</b><span><span class="num" style="color:var(--faint)">${nxt.id}</span> ${esc(nxt.text)}</span><span class="due num ${isLate(nxt)?"late":""}">${nxt.dueText?"期限 "+esc(nxt.dueText):""}${nxt.time?" ・ 目安 "+esc(nxt.time):""}</span></div>`
           : `<div class="next done-all">${emptyMsg}</div>`}
  </div>`;
}

function render(){
  const focusId = document.activeElement && document.activeElement.id;
  renderAll();
  if(focusId){ const el = document.getElementById(focusId); if(el) el.focus({preventScroll:true}); }
}
function renderAll(){
  const T = DATA.tasks, now = today();
  const left = days(now, toDate(D_DAY));
  document.getElementById("dday").textContent = left>0 ? `あと${left}日` : left===0 ? "今日が開業日" : `開業から${-left}日`;
  document.getElementById("dlabel").textContent = DATA.ddayLabel;
  document.getElementById("overall").textContent = `全体 ${T.filter(isDone).length}/${T.length} 完了`;

  const mine = T.filter(t=>t.who==="me"), ai = T.filter(t=>t.who==="ai");
  document.getElementById("team").innerHTML =
    card("自分がやること", "自", "var(--pA)", mine, "自分のタスクはすべて完了です。") +
    card("AI社員に頼むこと", "AI", "var(--pAI)", ai, "AI社員への依頼はすべて完了です。");

  const main = DATA.phases.filter(p=>/^F\d/.test(p.title) && !/の間|並行/.test(p.title));
  const cur = currentPhase(main, now);
  document.getElementById("strip").style.gridTemplateColumns = `repeat(${main.length},minmax(112px,1fr))`;
  document.getElementById("strip").innerHTML = main.map(p=>{
    const ts = T.filter(t=>t.phase===p.key); const d = ts.filter(isDone).length;
    return `<div class="ph ${p.key===cur?"now":""}"><span class="t">${esc(p.title)}</span><span class="d num">${esc(p.period)}</span>
      <div class="bar"><span style="width:${ts.length?d/ts.length*100:0}%"></span></div><span class="d num">${d}/${ts.length}</span></div>`;
  }).join("");

  document.getElementById("filters").innerHTML = FILTERS.map(([k,l])=>
    `<button class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join("");
  document.getElementById("hideDone").checked = state.hideDone;

  const limit = new Date(now); limit.setDate(limit.getDate()+7);
  const wk = T.filter(t=>t.due && !isDone(t) && toDate(t.due) <= limit).sort(byDue);
  document.getElementById("weekmeta").textContent = `期限が${limit.getMonth()+1}/${limit.getDate()}までで未完了のもの(期限切れを含む)`;
  document.getElementById("thisweek").innerHTML = listHTML(wk,"wk");

  document.getElementById("phases").innerHTML = DATA.phases.map(p=>{
    const ts = T.filter(t=>t.phase===p.key).sort(byDue);
    const d = ts.filter(isDone).length;
    const parallel = /の間|並行/.test(p.title);
    return `<section aria-label="${esc(p.title)}">
      <div class="sec-head"><h3>${esc(p.title)}${parallel?'<span class="side">並行作業</span>':""}</h3>
        <span class="meta num">${esc(p.period)} ・ ${d}/${ts.length} 完了</span></div>
      <div class="list">${listHTML(ts,p.key)}</div></section>`;
  }).join("");

  document.getElementById("weekrows").innerHTML = DATA.weeks.map((w,i)=>{
    const start = w.start ? toDate(w.start) : null;
    const nextStart = DATA.weeks[i+1] && DATA.weeks[i+1].start ? toDate(DATA.weeks[i+1].start) : null;
    const isNow = start && now >= start && (!nextStart || now < nextStart);
    const beforeFirst = i===0 && start && now < start && days(now,start) <= 7;
    return `<tr class="${isNow||beforeFirst?"this-week":""}"><td class="wk num">${esc(w.week)}</td><td class="num">${esc(w.period)}</td>
      <td>${md(w.me)}</td><td>${md(w.ai)}</td><td class="ms">${md(w.milestone)}</td></tr>`;
  }).join("");
}
function currentPhase(main, now){
  let cur = main[0].key;
  for(const p of main){
    const m = p.period.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m && new Date(+m[1],+m[2]-1,+m[3]) <= now) cur = p.key;
  }
  return cur;
}

document.addEventListener("change", async e=>{
  const el = e.target;
  if(el.matches('input[type=checkbox][data-id]')){
    const id = el.dataset.id;
    state.checks[id] = el.checked ? {done:true, at:new Date().toISOString()} : {done:false};
    render();
    if(state.db){
      try{ await state.db.doc("checks/"+id).set(state.checks[id]); }
      catch(err){ showSync(err && err.code==="invalid_argument" ? "この表示ではチェックを保存できません(閲覧のみ)" : "保存に失敗しました。もう一度チェックしてください"); }
    } else saveLocal();
  }
  if(el.id==="hideDone"){ state.hideDone = el.checked; try{localStorage.setItem("rs-hide", el.checked?"1":"0")}catch(e){} render(); }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-filter]"); if(!b) return;
  state.filter = b.dataset.filter; try{localStorage.setItem("rs-filter", state.filter)}catch(e){}
  render();
});
function showSync(msg){ document.getElementById("sync").textContent = msg; }
function saveLocal(){ try{ localStorage.setItem("rs-local-solo", JSON.stringify(state.checks)); }catch(e){} }
function loadLocal(){ try{ const v = JSON.parse(localStorage.getItem("rs-local-solo")||"null"); if(v) state.checks=v; }catch(e){} }

render();
(async ()=>{
  const db = window.claude && window.claude.use ? await window.claude.use("db").catch(()=>null) : null;
  if(!db){ loadLocal(); render(); showSync("保存先につながっていません。チェックはこの端末だけに残ります。"); return; }
  state.db = db;
  showSync("チェックは保存され、スマホとパソコンのどちらから開いても同じ状態になります。");
  db.collection("checks").onSnapshot(snap=>{
    const next = {};
    snap.docs.forEach(d=>{ const v=d.data(); if(v) next[d.id]={done:!!v.done, at:typeof v.at==="string"?v.at:null}; });
    state.checks = next; render();
  }, ()=> showSync("保存先との接続が切れました。ページを開き直してください。"));
})();
</script>
